<div class="simulator">
  <div class="machine-screen">
    <header class="machine-header">
      @if (backTarget(); as target) {
        <a class="back-link" [routerLink]="target">
          <span aria-hidden="true">‹</span>
          BACK
        </a>
      }

      <div class="header-identity">
        @if (auth.user(); as user) {
          <a class="current-user" [routerLink]="sessionTarget()">{{ user.displayName }}</a>
          <span class="identity-divider" aria-hidden="true"></span>
        }

        <a class="brand" [routerLink]="auth.user() ? sessionTarget() : '/'">
          UNIT<span class="brand-mark" aria-hidden="true">◔</span>
        </a>
      </div>
    </header>

    <main class="machine-content">
      @if (auth.notice()) {
        <p class="auth-notice" role="status">{{ auth.notice() }}</p>
      }
      <router-outlet />
    </main>

    <footer class="machine-footer">
      <a class="info-link" routerLink="/info" aria-label="Machine information">
        <span aria-hidden="true">i</span>
      </a>

      <span class="language" aria-label="Interface language: English">EN</span>

      <a class="status-link" routerLink="/diagnostics">
        <span class="status-text" aria-live="polite">{{ statusLabel() }}</span>
        <span
          class="status-dot"
          [class.green]="indicator() === 'green'"
          [class.amber]="indicator() === 'amber'"
          [class.red]="indicator() === 'red'"
          [class.unknown]="indicator() === 'unknown'"
          aria-hidden="true"
        ></span>
      </a>
    </footer>
  </div>

  <p class="simulator-caption">UNIT CASH MACHINE · LOCAL SIMULATOR</p>
</div>
