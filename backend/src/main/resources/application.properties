spring.application.name=unit-cash-machine

server.address=127.0.0.1
server.port=8080

# Database connection
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5434/unit_cash_machine}
spring.datasource.username=${DB_USERNAME:unit_app}
spring.datasource.password=${DB_PASSWORD}

# Hibernate checks the schema; Flyway changes it
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_schema=cash_machine
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Database migrations
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.clean-disabled=true

# Do not initialize the database through schema.sql/data.sql
spring.sql.init.mode=never

# Actuator endpoints
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# Standard error responses for Spring MVC request handling
spring.mvc.problemdetails.enabled=true

# Local HTTP session
server.servlet.session.timeout=15m
server.servlet.session.cookie.name=UNIT_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.tracking-modes=cookie

# Do not restore authenticated sessions after application restart
server.servlet.session.persistent=false

# Cash collection
unit.collection.securing-timeout-ms=5000
unit.collection.poll-interval-ms=250
unit.collection.monitor.enabled=true