spring.application.name=unit-cash-machine

server.address=127.0.0.1
server.port=8080

# Database connection
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5434/unit_cash_machine}
spring.datasource.username=${DB_USERNAME:unit_app}
spring.datasource.password=${DB_PASSWORD}

# Hibernate checks the schema; Flyway changes it
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_schema=cash_machine
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Database migrations
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.clean-disabled=true

# Do not initialize the database through schema.sql/data.sql
spring.sql.init.mode=never

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# Standard error responses for Spring MVC request handling
spring.mvc.problemdetails.enabled=true